    datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/aes
      username: aes-manager
      password: test
      testOnBorrow: true
      testWhileIdle: true
      validationQuery: select 1
      hikari:
        maximumPoolSize: 25
        minimumIdle: 5

springdoc:
  api-docs:
    path: /aes/api-docs
  swagger-ui:
    path: /aes/swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
