server:
  port: 8080

application:
  name: aes-manage

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mvc:
    locale-resolver: fixed
  jackson:
    serialization:
      indent_output: true
      fail_on_empty_beans: false
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterAccess=3600s


app:
  aes-manage:
    max-pages-of-partial-content: 20
